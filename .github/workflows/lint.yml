name: Lint

# PHP sözdizimi, Composer kilidi/güvenliği, birim testleri ve güvenlik
# regresyonları; ayrıca demo ortamında (SQL Server + sentetik LOGO verisi)
# kurulum sihirbazı şeması ve tüm sayfaların duman testi.

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} sözdizimi
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.json "php": "^8.2" — desteklenen aralığın alt ve üst ucu
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: PHP kurulumu
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, gd, mbstring, simplexml, xmlreader, xmlwriter, zip
          tools: composer

      - name: Sözdizimi denetimi (php -l)
        run: |
          hata=0
          toplam=0
          while IFS= read -r -d '' dosya; do
            toplam=$((toplam + 1))
            if ! php -l "$dosya" > /dev/null 2>&1; then
              echo "::error file=${dosya}::PHP sözdizimi hatası"
              php -l "$dosya" 2>&1 | head -3
              hata=$((hata + 1))
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          echo "Taranan: $toplam dosya · Hatalı: $hata"
          exit $hata

      - name: Composer kilidi doğrulama
        run: composer validate --strict --no-check-publish

      - name: Üretim bağımlılıklarını kur
        run: composer install --no-dev --no-interaction --no-progress --no-scripts --prefer-dist

      - name: PDF ve XLSX duman testi
        run: php scripts/dependency-smoke.php

      - name: Üretim bağımlılıklarını denetle
        run: composer audit --locked --no-dev

      - name: Birim testleri
        run: php tests/birim/calistir.php

  gizli-dosya-kontrolu:
    name: Güvenlik regresyonları
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Sırlar depoya girmiş mi
        run: |
          # Bu adlara sahip dosyalar herhangi bir klasörde sır içerebilir.
          hata=0
          while IFS= read -r -d '' dosya; do
            case "$(basename "$dosya")" in
              .env|_baglanti_.inc|.user.ini|.mcp.json)
                echo "::error file=${dosya}::Gizli bilgi taşıyabilen dosya depoya eklenmiş"
                hata=1
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$hata" -eq 0 ]; then
            echo "Gizli dosya sızıntısı yok."
          fi
          exit $hata

      - name: Güvenlik regresyon kontrolleri
        run: bash scripts/security-regression.sh

  demo-duman-testi:
    name: Demo ortamı + duman testi
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tekrar eden SQL parametresi taraması
        run: python3 demo/araclar/tekrar_parametre.py

      - name: Demo ortamını kur (SQL Server + sentetik LOGO verisi + sql/ şemaları)
        run: bash demo/kur.sh

      - name: Şema güncelleme tekrar çalıştırılabilir (mevcut kurulum senaryosu)
        run: |
          docker compose -f demo/docker-compose.yml exec -T app php scripts/sema_guncelle.php
          docker compose -f demo/docker-compose.yml exec -T app php scripts/sema_guncelle.php

      - name: Birim testleri (uygulama konteynerinde, PhpSpreadsheet dahil)
        run: docker compose -f demo/docker-compose.yml exec -T app php tests/birim/calistir.php

      - name: Duman testi (tüm sayfalar × 3 kullanıcı + oturumsuz erişim)
        run: docker compose -f demo/docker-compose.yml exec -T app php tests/duman/tara.php

      - name: Akış testleri (sipariş, iskonto, yazdırma, çek, döviz, ayarlar, yetki, API)
        run: docker compose -f demo/docker-compose.yml exec -T app php tests/akis/akislar.php

      - name: Bağımsız mod kur (LOGO'suz, Lumen çekirdek şeması)
        run: bash demo/kur.sh --bagimsiz

      - name: Bağımsız mod duman testi (taşınmamış modüller 501 kartı vermeli, çökmemeli)
        run: docker compose -f demo/docker-compose.yml exec -T app php tests/duman/tara.php

      - name: Bağımsız mod akış testleri (Lumen'e özgü akışlar)
        run: docker compose -f demo/docker-compose.yml exec -T app php tests/akis/bagimsiz.php

      - name: Bağımsız modda LOGO akışları (aynı akışlar LMV_ görünümleri üzerinden)
        run: docker compose -f demo/docker-compose.yml exec -T app php tests/akis/akislar.php

      - name: Konteyner logları (hata durumunda)
        if: failure()
        run: |
          docker compose -f demo/docker-compose.yml logs --tail=200
          tail -n 100 logs/app/app-error.log logs/php/php_errors.log 2>/dev/null || true

