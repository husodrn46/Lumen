name: Lint

# PHP yardımcı ve API gövde regresyonları sentetik PDO ile çalışır.
# Gerçek SQL Server/LOGO testi ayrı, opt-in kabul kapısıdır.

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      confirm_synthetic_only:
        description: 'Geçici SQL Developer/EULA ve sentetik SQL kabulünü de çalıştır'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sql-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_synthetic_only && github.repository == 'husodrn46/Lumen' }}
    uses: ./.github/workflows/sqlserver-acceptance.yml
    with:
      confirm_synthetic_only: ${{ inputs.confirm_synthetic_only }}

  php-lint:
    name: PHP ${{ matrix.php }} sözdizimi
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.json "php": "^8.2" — desteklenen aralığın alt ve üst ucu
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: PHP kurulumu
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, gd, mbstring, simplexml, xmlreader, xmlwriter, zip
          tools: composer

      - name: Sözdizimi denetimi (php -l)
        run: |
          hata=0
          toplam=0
          while IFS= read -r -d '' dosya; do
            toplam=$((toplam + 1))
            if ! php -l "$dosya" > /dev/null 2>&1; then
              echo "::error file=${dosya}::PHP sözdizimi hatası"
              php -l "$dosya" 2>&1 | head -3
              hata=$((hata + 1))
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          echo "Taranan: $toplam dosya · Hatalı: $hata"
          exit $hata

      - name: Yardımcı ve API davranış regresyonları
        run: |
          php tests/run.php
          php tests/permission-regression.php
          php tests/api-regression.php
          php tests/idempotency-regression.php
          php tests/web-intent-regression.php
          php tests/ci-prepare-regression.php

      - name: İzole localhost HTTP regresyonları
        run: |
          python3 tests/http-regression.py
          python3 tests/web-regression.py

      - name: Web çift gönderim guard
        run: node tests/web-intent-js.test.cjs

      - name: Composer kilidi doğrulama
        run: composer validate --strict --no-check-publish

      - name: Üretim bağımlılıklarını kur
        run: composer install --no-dev --no-interaction --no-progress --no-scripts --prefer-dist

      - name: PDF ve XLSX duman testi
        run: php scripts/dependency-smoke.php

      - name: Üretim bağımlılıklarını denetle
        run: composer audit --locked --no-dev

  gizli-dosya-kontrolu:
    name: Güvenlik regresyonları
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Sırlar depoya girmiş mi
        run: |
          # Bu adlara sahip dosyalar herhangi bir klasörde sır içerebilir.
          hata=0
          while IFS= read -r -d '' dosya; do
            case "$(basename "$dosya")" in
              .env|_baglanti_.inc|.user.ini|.mcp.json)
                echo "::error file=${dosya}::Gizli bilgi taşıyabilen dosya depoya eklenmiş"
                hata=1
                ;;
            esac
          done < <(git ls-files -z)
          if [ "$hata" -eq 0 ]; then
            echo "Gizli dosya sızıntısı yok."
          fi
          exit $hata

      - name: Güvenlik regresyon kontrolleri
        run: bash scripts/security-regression.sh
