name: Kabul testi

# Bir sürümün kabul testi: demoyu iki modda kurar, bütün test takımlarını, "iş günü"
# senaryosunu ve sunucu denetimini koşar (tests/kabul/calistir.sh). Rapor, çalıştırmanın
# özet sayfasında görünür ve "kabul-raporu" adıyla indirilebilir.
# Her sürüm etiketinde (v*) kendiliğinden çalışır; Actions sekmesinden elle de
# başlatılabilir (gh workflow run kabul.yml -f ref=v1.3.0-beta.3). Ayrıntı: docs/test/KABUL_TESTI.md

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Denenecek sürüm etiketi, dal ya da commit (boş: seçilen dal)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  kabul:
    name: Kabul testi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Kabul testi (tests/kabul/calistir.sh)
        run: |
          if [ ! -f tests/kabul/calistir.sh ]; then
            echo "Bu sürümde kabul testi paketi yok (v1.3.0-beta.4 ve sonrasında var)." | tee kabul-raporu.md
            exit 0
          fi
          bash tests/kabul/calistir.sh --rapor kabul-raporu.md

      - name: Raporu özet sayfasına yaz
        if: always()
        run: cat kabul-raporu.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Rapor üretilemedi." >> "$GITHUB_STEP_SUMMARY"

      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kabul-raporu
          path: kabul-raporu.md
          if-no-files-found: warn

      - name: Konteyner logları (hata durumunda)
        if: failure()
        run: |
          docker compose -f demo/docker-compose.yml logs --tail=200
          tail -n 100 logs/app/app-error.log logs/php/php_errors.log 2>/dev/null || true
