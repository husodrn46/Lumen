<!DOCTYPE html>
<html lang="tr">
<head>

    <style>
        :root {
            --bg: #f9fafb;
            --text-1: #1f2937;
            --text-2: #6b7280;
            --text-3: #9ca3af;
            --border: #e5e7eb;
            --red: #6F1022;
            --amber: #d97706;
            --amber-soft: #fffbeb;
            --emerald: #059669;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Avenir Next', 'Montserrat', 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(1200px 600px at 8% -10%, rgba(217, 119, 6, .13), transparent 60%),
                radial-gradient(900px 500px at 92% 110%, rgba(99, 102, 241, .07), transparent 55%),
                var(--bg);
            color: var(--text-1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(217, 119, 6, 0.20);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            padding: 42px 32px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .brand {
            display: inline-flex; align-items: center; gap: 10px;
            margin-bottom: 22px;
            font-size: 11px; font-weight: 600;
            color: var(--text-2); text-transform: uppercase; letter-spacing: 1.2px;
        }
        .brand img { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; }
        .icon-box {
            width: 96px; height: 96px;
            margin: 0 auto 22px;
            border-radius: 24px;
            background: var(--amber-soft);
            color: var(--amber);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        .icon-box svg { width: 52px; height: 52px; }
        .icon-box .hand {
            transform-origin: center;
            animation: tick 6s linear infinite;
        }
        @keyframes tick {
            to { transform: rotate(360deg); }
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: 10px;
        }
        .desc {
            font-size: 14px;
            color: var(--text-2);
            line-height: 1.65;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 28px;
            background: var(--emerald);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.32);
            background: #047857;
        }
        .btn:active { transform: translateY(0); }
        .countdown {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px dashed var(--border);
            font-size: 12.5px;
            color: var(--text-3);
        }
        .countdown span {
            color: var(--amber);
            font-weight: 700;
            font-size: 14px;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translate3d(0, 12px, 0) scale(0.985); }
            to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }
        @media (max-width: 480px) {
            .glass-card { padding: 32px 22px; border-radius: 16px; }
            .title { font-size: 20px; }
            .desc { font-size: 13px; }
            .btn { padding: 12px 24px; font-size: 13px; }
            .icon-box { width: 80px; height: 80px; margin-bottom: 16px; }
            .icon-box svg { width: 42px; height: 42px; }
        }
    </style>
</head>
<body>
    <main class="glass-card">
        <div class="brand">
            <img src="logo.png" alt="Lumen" onerror="this.style.display='none'">
            Lumen Siparis Sistemi
        </div>

        <div class="icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

                <polyline points="12 6 12 12 16 14" class="hand"/>
                <circle cx="12" cy="12" r="1" fill="currentColor"/>
            </svg>

            Tekrar Giris Yap
        </a>

        <p class="countdown">
            <span id="timer">5</span> saniye icinde giris sayfasina yonlendirileceksiniz

        let seconds = 5;
        const timer = document.getElementById('timer');
        setInterval(() => {
            seconds--;
            if (seconds >= 0 && timer) timer.textContent = seconds;
        }, 1000);
    </script>
</body>
</html>
