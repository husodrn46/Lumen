# Lumen demo — nginx. README "Sunucu yapılandırması" bölümündeki erişim
# kuralları birebir burada uygulanır; demo bu kuralları da sınamış olur.
server {
    listen 80;
    root /var/www/html;
    index index.php;
    client_max_body_size 16m;

    # --- README'deki nginx kuralları ---
    location ~ /\.            { deny all; }          # .env, .git, .user.ini …
    location ~* \.(inc|ini|sql|log|bak|example|db)$ { deny all; }
    location ~* ^/composer\.(json|lock)$ { deny all; }
    location ~ ^/(logs|tmp|sql|vendor|scripts|database|demo|tests)/   { deny all; }
    # ------------------------------------

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
    }
}
