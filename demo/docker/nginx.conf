# Lumen demo — nginx. README "Sunucu yapılandırması" bölümündeki erişim
# kuralları birebir burada uygulanır; demo bu kuralları da sınamış olur.
server {
    listen 80;
    root /var/www/html;
    index index.php;
    client_max_body_size 16m;

    # --- README'deki nginx kuralları ---
    location ~ /\.            { deny all; }          # .env, .git, .user.ini …
    location ~* \.(inc|ini|sql|log|bak|example|db)$ { deny all; }
    location ~* (^|/)web\.config$ { deny all; }            # IIS kuralları (nginx'te anlamsız, ifşa etmesin)
    location ~* \.lumen\.gz$ { deny all; }                   # Lumen yedekleri (yanlış klasöre konmuş olsa bile)
    location ~* ^/composer\.(json|lock)$ { deny all; }
    location ~ ^/(logs|tmp|sql|vendor|scripts|database|demo|tests|includes)/   { deny all; }
    # Güvenlik başlıkları (web.config / .htaccess ile aynı)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.tailwindcss.com cdnjs.cloudflare.com cdn.jsdelivr.net cdn.datatables.net code.jquery.com unpkg.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdnjs.cloudflare.com cdn.jsdelivr.net cdn.datatables.net; font-src 'self' fonts.gstatic.com cdnjs.cloudflare.com data:; img-src 'self' data: blob:; connect-src 'self' cdn.datatables.net; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self';" always;
    # HTTPS kullanıyorsanız: add_header Strict-Transport-Security "max-age=31536000" always;
    fastcgi_hide_header X-Powered-By;
    # ------------------------------------

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
    }
}
